services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dravix
      POSTGRES_PASSWORD: dravix
      POSTGRES_DB: dravix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage
volumes:
  pgdata:
  qdrant:
