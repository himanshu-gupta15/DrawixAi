services:
  - type: web
    name: dravix-ai
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/system
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dravix-postgres
          property: connectionString
      - key: VECTOR_DATABASE_URL
        sync: false
      - key: VECTOR_DATABASE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false

databases:
  - name: dravix-postgres
    databaseName: dravix
    user: dravix
    plan: free
